name: DevOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Project Files
        run: |
          echo "Checking project files..."
          ls -la

      - name: Build Application
        run: |
          echo "Building DevOps WebApp..."
          test -f index.html
          echo "Build completed successfully!"

      - name: Run Tests
        run: |
          echo "Running tests..."
          test -f index.html
          echo "Tests passed successfully!"

      - name: Send Success Notification to Slack
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"✅ CI Pipeline Successful!\nRepository: devops-webapp\nBranch: main\nCommit: '"$GITHUB_SHA"'"}' \
            "$SLACK_WEBHOOK_URL"

      - name: Send Failure Notification to Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"❌ CI Pipeline Failed!\nRepository: devops-webapp\nBranch: main\nCommit: '"$GITHUB_SHA"'"}' \
            "$SLACK_WEBHOOK_URL"